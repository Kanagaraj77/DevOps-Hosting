
version: "3.9"

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    restart: always
    environment:
      MONGO_URI: "mongodb://mongo:27017/mydatabase"
      JWT_SECRET: "your-secret-key"
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:


services:
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "80:80"

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "5000:5000"

